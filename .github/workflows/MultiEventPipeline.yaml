name: "Multi Event Pipeline/ workflow"

on:
  push:
    branches:
      - master
    pull_request:
        branches:
            - master
  
jobs:
  on-job:
    runs-on: ubuntu-latest
    steps:
      - name: "Run on push to master"
        run: echo "This job runs on push to master branch"

        on pull_request:
            runs-on: ubuntu-latest
            steps:
              - name: "Run on pull request to master"
                run: echo "This job runs on pull request to master branch"
         
      
      